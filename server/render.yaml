databases:
  - name: powerbid-db
    databaseName: powerbid_prod
    user: powerbid_user
    plan: free
    region: oregon

services:
  - type: web
    name: powerbid-game-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: powerbid-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_REQUIRED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: INVITE_BASE_URL
        value: "https://powerbid.app/invite"
      - key: ALLOW_MOCK_OAUTH
        value: "false"
